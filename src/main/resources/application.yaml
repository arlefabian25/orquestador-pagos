spring:
  application:
    name: pagos
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pagos}
    username: ${DB_USER:pagos}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000          # 8.1: 3 s para obtener conexión
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                # el esquema lo maneja Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
      jakarta.persistence.query.timeout: 5000   # 8.1: statement timeout de 5 s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}

pagos:
  proveedor:
    nombre: psp
    url-base: ${PSP_BASE_URL:http://localhost:8089}
    api-key: ${PSP_API_KEY}             # desde el gestor de secretos, nunca en el repositorio
    secreto-webhook: ${PSP_WEBHOOK_SECRET}
    timeout-conexion: 2s
    timeout-lectura-crear: 8s
    timeout-lectura-consulta: 5s
    ventana-firma: 5m
  orden:
    vigencia: 30m
  inbox:
    intervalo: PT1S                     # formato ISO-8601 porque lo usa @Scheduled
    tamano-lote: 50
    max-intentos: 8
  conciliacion:
    intervalo: PT1M
    primera-consulta: 1m
    created-huerfano-despues-de: 2m
    limite-total: 24h
    tamano-lote: 50
  outbox:
    intervalo: PT1S
    tamano-lote: 100
    topico: pagos.eventos
  idempotencia:
    expiracion: 24h
  tareas:
    # Apagadas mientras los casos de uso del esqueleto no estén implementados.
    habilitadas: ${PAGOS_TAREAS_HABILITADAS:false}
  resiliencia:                          # secciones 8.2 y 8.3
    circuito:
      ventana: 20
      umbral-fallos: 50
      umbral-lentas: 50
      llamada-lenta: 8s
      espera-abierto: 30s
      llamadas-semiabierto: 5
    reintento-crear:
      max-intentos: 2                   # 1 intento + 1 reintento
      espera: 300ms
    bulkhead:
      max-concurrentes: 50

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
